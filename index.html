<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣夜市消消樂</title>
    <!-- 引入可愛氣球胖胖字體：英數 Fredoka + 中文 Zen Maru Gothic 圓體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --font-balloon: 'Fredoka', 'Zen Maru Gothic', 'Yuanti TC', '蘋方-繁', 'Microsoft JhengHei', cursive, sans-serif;
        }

        /* ========== 共用版面 ========== */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #12081c;
            color: #fff;
            font-family: var(--font-balloon);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(255, 80, 50, 0.35), transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 200, 40, 0.25), transparent 45%),
                radial-gradient(ellipse at 50% 100%, rgba(80, 40, 160, 0.45), transparent 55%),
                linear-gradient(#1a0a28, #0b0614 70%);
        }

        /* 畫面切換：一次只顯示一個畫面 */
        .screen {
            display: none;
            width: 100%;
            max-width: 640px;
            padding: 24px 16px;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .screen.active {
            display: flex;
        }

        /* 遊戲首頁 */
        #home-screen {
            max-width: none;
            width: 100%;
            min-height: 100vh;
            padding: 0 16px 24vh;
            justify-content: flex-end;
            background-image: url('assets/images/bg-home.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .home-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #bgm-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 56px;
            margin: 20px auto 0;
            padding: 0;
            font-family: var(--font-balloon);
            font-size: 28px;
            line-height: 1;
            color: #fff8d0;
            background: linear-gradient(#ffcf5a, #e86b20);
            border: 4px solid #fff8d0;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 5px 0 #8a2e00, 0 8px 18px rgba(0, 0, 0, 0.45), inset 0 0 10px rgba(255, 255, 255, 0.25);
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        #bgm-toggle:hover,
        #bgm-toggle:focus-visible {
            transform: scale(1.06);
            filter: brightness(1.08);
        }

        #bgm-toggle:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #8a2e00, 0 5px 12px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 420px) {
            #bgm-toggle {
                width: 60px;
                height: 52px;
                font-size: 25px;
            }
        }

        /* 遊戲核心頁：背景會根據關卡的 bg 動態改變 */
        #game-screen {
            max-width: none;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
        }

        /* ========== 標題與按鈕 ========== */
        .home-title {
            font-family: var(--font-balloon);
            font-size: clamp(30px, 6.5vw, 44px);
            font-weight: 900;
            margin: 8px 0 6px;
            color: #fff8d0;
            letter-spacing: 2px;
            -webkit-text-stroke: 4px #5c2000;
            paint-order: stroke fill;
            text-shadow: 0 4px 0 #3a1000, 0 0 18px #ff5a3c, 0 0 28px #ffc83c;
        }

        .home-subtitle {
            margin: 0 0 24px;
            font-size: 16px;
            color: #ffe7a8;
        }

        .btn {
            display: block;
            width: min(300px, 82vw);
            margin: 12px auto;
            padding: 16px 22px;
            font-family: var(--font-balloon);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(#ffd76a, #ff9a2e);
            border: 4px solid #fff;
            border-radius: 18px;
            cursor: pointer;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
            box-shadow: 0 6px 0 #b86a12, 0 10px 22px rgba(0, 0, 0, 0.4);
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .btn:hover {
            transform: scale(1.05) translateY(-1px);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: linear-gradient(#b48aff, #6a3dff);
            color: #fff;
            border-color: #f0e4ff;
            box-shadow: 0 6px 0 #3d1a9a, 0 10px 22px rgba(0, 0, 0, 0.4);
        }

        #home-screen #btn-start {
            background: linear-gradient(#5ad2ff, #1a78ff);
            border-color: #e8f7ff;
            box-shadow: 0 7px 0 #0d4aa8, 0 12px 26px rgba(10, 40, 120, 0.55);
        }

        #home-screen #btn-levels,
        #home-screen #btn-howto {
            background: linear-gradient(#c08bff, #7a3dff);
            border-color: #f4e8ff;
            box-shadow: 0 7px 0 #4a1aa0, 0 12px 26px rgba(60, 20, 120, 0.55);
        }

        .btn-ghost {
            background: linear-gradient(#ffe27a, #ffb03a);
            color: #3a1200;
            border: 4px solid #fff8d0;
            box-shadow: 0 5px 0 #b86a12, 0 8px 18px rgba(0, 0, 0, 0.35);
            width: auto;
            min-width: 160px;
            margin-top: 18px;
            text-shadow: none;
        }

        .btn:disabled,
        .level-card.locked {
            cursor: not-allowed;
            filter: grayscale(0.6);
            opacity: 0.7;
            transform: none;
        }

        /* ========== 關卡卡片 ========== */
        .level-list {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 12px 0 8px;
        }

        .level-card {
            text-align: left;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #ffd76a;
            background: rgba(30, 10, 20, 0.75);
            color: #fff;
            cursor: pointer;
        }

        .level-card strong {
            display: block;
            font-size: 18px;
            color: #ffd76a;
        }

        .level-card small {
            color: #ccc;
        }

        /* ========== 遊戲畫面與棋盤樣式 ========== */
        #game-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(10, 4, 18, 0.38);
            pointer-events: none;
            z-index: 0;
        }

        #game-screen>* {
            position: relative;
            z-index: 1;
        }

        .game-title {
            font-family: var(--font-balloon);
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 900;
            margin: 4px 0 14px;
            padding: 10px 28px;
            color: #fff8c8;
            letter-spacing: 2px;
            -webkit-text-stroke: 4px #5c2000;
            paint-order: stroke fill;
            text-shadow: 0 4px 0 #3a1000, 0 0 16px rgba(255, 200, 60, 0.7);
            background: linear-gradient(#ffb347, #ff6a2a 55%, #e84a1a);
            border: 4px solid #fff3c2;
            border-radius: 22px;
            box-shadow: 0 6px 0 #8a2e00, 0 0 22px rgba(255, 140, 40, 0.55);
        }

        #hud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 0 0 16px;
            width: 100%;
            max-width: 800px;
        }

        #score-board,
        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-balloon);
            font-size: 18px;
            font-weight: 900;
            color: #ffe27a;
            margin: 0;
            padding: 8px 18px;
            background: rgba(18, 8, 16, 0.88);
            border: 4px solid #ffd76a;
            border-radius: 999px;
            box-shadow: 0 0 0 3px #7a3a00, 0 6px 16px rgba(0, 0, 0, 0.45), inset 0 0 12px rgba(255, 210, 80, 0.18);
        }

        #score-board #score,
        .hud-chip span {
            color: #fff8d0;
            min-width: 2ch;
        }

        #result-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 80;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: rgba(10, 4, 18, 0.72);
        }

        #result-overlay.show {
            display: flex;
        }

        .result-card {
            width: min(420px, 92vw);
            padding: 28px 22px 22px;
            text-align: center;
            background: linear-gradient(#3a2218, #1a0e12);
            border: 4px solid #ffd76a;
            border-radius: 20px;
            box-shadow: 0 0 0 4px #8a3a00, 0 12px 32px rgba(0, 0, 0, 0.55);
        }

        .result-card h2 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #fff8d0;
            -webkit-text-stroke: 3px #5c2000;
            paint-order: stroke fill;
        }

        .result-card p {
            margin: 0 0 18px;
            color: #ffe7a8;
            font-size: 16px;
            line-height: 1.5;
        }

        .result-card .btn {
            width: 100%;
            box-sizing: border-box;
        }

        .result-card .btn-retry {
            background: linear-gradient(#ff5a5f, #c62828);
            border-color: #ffe8e8;
            box-shadow: 0 6px 0 #8e1b1b, 0 10px 22px rgba(110, 10, 10, 0.45);
        }

        #board-wrap {
            position: relative;
            width: 520px;
            max-width: 92vw;
            aspect-ratio: 1 / 1;
            padding: 12px;
            background: linear-gradient(#3a2218, #1a0e12);
            border: 6px solid #ffd76a;
            border-radius: 20px;
            box-shadow:
                0 0 0 4px #8a3a00,
                0 10px 28px rgba(0, 0, 0, 0.55),
                0 0 24px rgba(255, 180, 40, 0.35);
        }

        #board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            background-color: #241418;
            padding: 8px;
            border-radius: 12px;
            border: 3px solid #c48a3a;
            box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.55);
        }

        #board.busy .tile {
            pointer-events: none;
            cursor: default;
        }

        .tile {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2a2a2a;
            user-select: none;
            touch-action: none;
            transition: transform 0.1s ease;
            overflow: hidden;
            position: relative;
        }

        /* The tile elements stay in their grid cells while their contents slide
           across them. --swap-x/y are measured from the actual cell positions,
           so this also follows responsive board sizing and grid gaps. */
        .tile.swapping {
            z-index: 10;
            overflow: visible;
            will-change: transform;
            transition: transform 205ms cubic-bezier(0.22, 0.82, 0.3, 1.12);
            transform: translate(var(--swap-x, 0px), var(--swap-y, 0px));
        }

        .tile.swapping.swap-back {
            transition-duration: 180ms;
            transition-timing-function: cubic-bezier(0.38, 0, 0.58, 1);
            transform: translate(0, 0);
        }

        .tile img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            pointer-events: none;
        }

        .tile.matching {
            z-index: 3;
            overflow: visible;
            animation: tileMatch 380ms ease-in forwards;
            transition: none;
            pointer-events: none;
        }

        .tile.matching img {
            animation: tileGlow 380ms ease-in forwards;
        }

        @keyframes tileMatch {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }

            22% {
                transform: scale(1.2) rotate(-8deg);
                opacity: 1;
            }

            100% {
                transform: scale(0) rotate(18deg);
                opacity: 0;
            }
        }

        @keyframes tileGlow {
            0% {
                filter: brightness(1) drop-shadow(0 0 0 transparent);
            }

            28% {
                filter: brightness(2.1) drop-shadow(0 0 10px #fff6b0) drop-shadow(0 0 18px #ffcc44);
            }

            100% {
                filter: brightness(1.6) drop-shadow(0 0 4px #fff);
            }
        }

        .tile.tile-drop {
            animation: tileDrop 450ms cubic-bezier(0.25, 0.82, 0.32, 1) both;
            transition: none;
            z-index: 2;
        }

        .tile.tile-drop-new {
            animation: tileDropBounce 520ms cubic-bezier(0.22, 0.9, 0.32, 1.18) both;
            transition: none;
            z-index: 2;
        }

        @keyframes tileDrop {
            from {
                transform: translateY(var(--drop-from, -48px));
            }

            to {
                transform: translateY(0);
            }
        }

        @keyframes tileDropBounce {
            0% {
                transform: translateY(var(--drop-from, -80px));
                opacity: 0.88;
            }

            72% {
                transform: translateY(5px);
                opacity: 1;
            }

            86% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* 關卡開場專用掉落動畫 */
        .tile.level-entry {
            animation: tileLevelEntry 480ms cubic-bezier(0.22, 0.88, 0.32, 1.12) both;
            transition: none;
            z-index: 2;
        }

        @keyframes tileLevelEntry {
            0% {
                transform: translateY(var(--entry-from, -320px)) scale(0.92);
                opacity: 0.15;
            }

            68% {
                transform: translateY(5px) scale(1.03);
                opacity: 1;
            }

            84% {
                transform: translateY(-3px) scale(0.99);
                opacity: 1;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        #fx-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
            z-index: 25;
        }

        .fx-particle {
            position: absolute;
            left: 0;
            top: 0;
            font-size: 12px;
            line-height: 1;
            will-change: transform, opacity;
            animation: particleFly 620ms ease-out forwards;
        }

        .fx-particle.dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffe27a;
            box-shadow: 0 0 6px #ffd76a;
        }

        .fx-particle.star {
            font-size: 14px;
            text-shadow: 0 0 6px #fff;
        }

        .fx-particle.spark {
            width: 10px;
            height: 2px;
            border-radius: 2px;
            background: #fff8d0;
            box-shadow: 0 0 8px #fff;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translate(var(--px), var(--py)) scale(0.4);
            }
        }

        .fx-score-pop {
            position: absolute;
            left: 50%;
            top: 16%;
            transform: translate(-50%, 0) scale(1);
            font-family: var(--font-balloon);
            font-size: 38px;
            font-weight: 900;
            color: #fff066;
            -webkit-text-stroke: 4px #5c2000;
            paint-order: stroke fill;
            text-shadow: 0 4px 0 #3a1000, 0 6px 10px rgba(0, 0, 0, 0.6);
            animation: scorePop 650ms cubic-bezier(0.18, 0.89, 0.32, 1.25) forwards;
            white-space: nowrap;
            z-index: 15;
            pointer-events: none;
            user-select: none;
        }

        @keyframes scorePop {
            0% {
                opacity: 0;
                transform: translate(-50%, 15px) scale(0.4, 0.4);
            }

            28% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1.35, 0.8);
            }

            50% {
                transform: translate(-50%, -10px) scale(0.9, 1.2);
            }

            75% {
                opacity: 1;
                transform: translate(-50%, -20px) scale(1.05, 0.95);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -40px) scale(0.85, 1.05);
            }
        }

        .fx-float-word {
            position: absolute;
            font-family: var(--font-balloon);
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            -webkit-text-stroke: 3.5px #7a1500;
            paint-order: stroke fill;
            text-shadow: 0 3px 0 #420800, 0 4px 8px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            will-change: transform, opacity;
            animation: floatWordUp 620ms cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            white-space: nowrap;
            z-index: 30;
            user-select: none;
        }

        @keyframes floatWordUp {
            0% {
                opacity: 0;
                transform: translate(-50%, -10%) scale(0.3) rotate(-8deg);
            }

            25% {
                opacity: 1;
                transform: translate(-50%, -65%) scale(1.4, 0.75) rotate(4deg);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -115%) scale(0.85, 1.25) rotate(-2deg);
            }

            75% {
                opacity: 0.95;
                transform: translate(-50%, -155%) scale(1.05, 0.95) rotate(1deg);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -195%) scale(0.85, 1.1) rotate(0deg);
            }
        }

        .shake-sm {
            animation: boardShakeSm 160ms ease-in-out;
        }

        .shake-md {
            animation: boardShakeMd 220ms ease-in-out;
        }

        .shake-lg {
            animation: boardShakeLg 300ms ease-in-out;
        }

        @keyframes boardShakeSm {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-2px, 1.5px);
            }

            50% {
                transform: translate(2px, -2px);
            }

            75% {
                transform: translate(-1.5px, -1px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes boardShakeMd {
            0% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(-4px, 3px) scale(1.01);
            }

            40% {
                transform: translate(4px, -3px) scale(0.995);
            }

            60% {
                transform: translate(-3px, 2px) scale(1.005);
            }

            80% {
                transform: translate(2px, -1px);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes boardShakeLg {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }

            15% {
                transform: translate(-10px, 6px) rotate(-2deg) scale(1.04);
            }

            35% {
                transform: translate(10px, -6px) rotate(2deg) scale(0.96);
            }

            55% {
                transform: translate(-7px, 4px) rotate(-1deg) scale(1.02);
            }

            75% {
                transform: translate(5px, -3px) rotate(1deg);
            }

            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
        }

        #combo-banner {
            position: absolute;
            left: 50%;
            top: 32%;
            transform: translate(-50%, -50%) scale(0.3);
            pointer-events: none;
            z-index: 40;
            font-family: var(--font-balloon);
            font-weight: 900;
            letter-spacing: 3px;
            white-space: pre;
            text-align: center;
            line-height: 1.18;
            opacity: 0;
            user-select: none;
            paint-order: stroke fill;
        }

        #combo-banner.show {
            animation: comboPopIn 620ms cubic-bezier(0.175, 0.885, 0.32, 1.35) forwards;
        }

        @keyframes comboPopIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2, 0.2) rotate(-6deg);
            }

            28% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.4, 0.76) rotate(2deg);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.88, 1.24) rotate(-1deg);
            }

            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.06, 0.96) rotate(1deg);
            }

            85% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1, 1) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(0.92, 1.05) rotate(0deg);
            }
        }

        #combo-banner.combo-1 {
            font-size: 38px;
            color: #ffe642;
            -webkit-text-stroke: 5px #4a1c00;
            text-shadow: 0 4px 0 #2b0e00, 0 8px 14px rgba(0, 0, 0, 0.7);
        }

        #combo-banner.combo-2 {
            font-size: 40px;
            color: #ff9800;
            -webkit-text-stroke: 5px #421200;
            text-shadow: 0 4px 0 #260700, 0 8px 16px rgba(255, 120, 0, 0.4), 0 10px 18px rgba(0, 0, 0, 0.8);
        }

        #combo-banner.combo-3 {
            font-size: 44px;
            color: #ff4081;
            -webkit-text-stroke: 5px #4a0022;
            text-shadow: 0 4px 0 #2b0013, 0 8px 18px rgba(255, 30, 100, 0.5), 0 10px 20px rgba(0, 0, 0, 0.85);
        }

        #combo-banner.combo-4 {
            font-size: 48px;
            color: #ffeb3b;
            -webkit-text-stroke: 6px #280345;
            text-shadow: 0 4px 0 #140024, 0 0 16px rgba(255, 235, 59, 0.8), 0 8px 24px rgba(170, 0, 255, 0.7), 0 12px 24px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

<body>

    <audio id="bgm-player" loop></audio>

    <!-- ===== 畫面 1：遊戲首頁 ===== -->
    <section id="home-screen" class="screen active" aria-label="遊戲首頁">
        <div class="home-menu">
            <button class="btn" type="button" id="btn-start">▶ 開始遊戲</button>
            <button class="btn btn-secondary" type="button" id="btn-levels">▦ 關卡選擇</button>
            <button class="btn btn-secondary" type="button" id="btn-howto">📖 新手教學</button>
            <button id="bgm-toggle" type="button" aria-label="開啟背景音樂" aria-pressed="false" title="開啟背景音樂">🔇</button>
        </div>
    </section>

    <!-- ===== 畫面 2：關卡選擇 ===== -->
    <section id="level-screen" class="screen" aria-label="關卡選擇">
        <h1 class="home-title">關卡選擇</h1>
        <p class="home-subtitle">準備好橫掃全台夜市了嗎！</p>
        <div class="level-list" id="level-list"></div>
        <button class="btn btn-ghost" type="button" data-go-home>返回首頁</button>
    </section>

    <!-- ===== 畫面 3：遊戲主畫面 ===== -->
    <section id="game-screen" class="screen" aria-label="遊戲畫面">
        <h1 class="game-title" id="game-title">逢甲夜市消消樂</h1>
        <div id="hud">
            <div class="hud-chip">📍 <span id="level-label">第 1 關</span></div>
            <div id="score-board">🏆 分數：<span id="score">0</span></div>
            <div class="hud-chip">🎯 目標：<span id="goal-score">0</span></div>
            <div class="hud-chip">👣 步數：<span id="moves-left">0</span></div>
        </div>
        <div id="board-wrap">
            <div id="board"></div>
            <div id="fx-layer" aria-hidden="true"></div>
            <div id="combo-banner" aria-hidden="true"></div>
        </div>
        <button class="btn btn-ghost" type="button" id="btn-back-home">返回首頁</button>
        <div id="result-overlay" aria-hidden="true">
            <div class="result-card">
                <h2 id="result-title">通關成功</h2>
                <p id="result-desc"></p>
                <button class="btn btn-next" type="button" id="btn-next-level">下一關</button>
                <button class="btn btn-retry" type="button" id="btn-retry">再試一次</button>
                <button class="btn btn-secondary" type="button" id="btn-to-levels">關卡選擇</button>
            </div>
        </div>
    </section>

    <script>
        const bgmPlayer = document.getElementById('bgm-player');
        const bgmToggle = document.getElementById('bgm-toggle');
        const MAIN_BGM = 'assets/audio/Midnight_Market_Rush.mp3';
        let bgmEnabled = true;

        function updateBgmToggle() {
            if (!bgmToggle) return;
            const isPlaying = bgmEnabled && bgmPlayer && !bgmPlayer.paused && !bgmPlayer.muted;
            bgmToggle.textContent = isPlaying ? '🔊' : '🔇';
            bgmToggle.setAttribute('aria-label', isPlaying ? '關閉背景音樂' : '開啟背景音樂');
            bgmToggle.setAttribute('aria-pressed', String(isPlaying));
            bgmToggle.title = isPlaying ? '關閉背景音樂' : '開啟背景音樂';
        }

        function playBgm(bgmSrc) {
            if (!bgmEnabled || !bgmPlayer || !bgmSrc) return;
            if (bgmPlayer.src !== new URL(bgmSrc, window.location.href).href) {
                bgmPlayer.src = bgmSrc;
            }
            return bgmPlayer.play().then(function () {
                updateBgmToggle();
            }).catch(function (err) {
                updateBgmToggle();
                console.log('Autoplay blocked:', err);
            });
        }

        function stopBgm() {
            if (bgmPlayer) {
                bgmPlayer.pause();
                bgmPlayer.currentTime = 0;
            }
        }

        bgmToggle.addEventListener('click', function () {
            const isPlaying = bgmPlayer && !bgmPlayer.paused && !bgmPlayer.muted;
            if (isPlaying) {
                bgmEnabled = false;
                stopBgm();
            } else {
                bgmEnabled = true;
                const activeScreen = document.querySelector('.screen.active');
                const activeLevel = activeScreen && activeScreen.id === 'game-screen'
                    ? getLevelConfig(currentLevelId)
                    : null;
                playBgm(activeLevel ? activeLevel.bgm : MAIN_BGM);
            }
            updateBgmToggle();
        });
        bgmPlayer.addEventListener('play', updateBgmToggle);
        bgmPlayer.addEventListener('pause', updateBgmToggle);
        bgmPlayer.addEventListener('volumechange', updateBgmToggle);
        updateBgmToggle();

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(function (el) {
                el.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() {
            entryAnimationToken++;
            playBgm(MAIN_BGM);
            hideResultOverlay();
            showScreen('home-screen');
        }

        function startGame(levelId) {
            if (typeof levelId !== 'number') {
                levelId = getContinueLevelId();
            }
            beginLevel(levelId);
        }

        document.getElementById('btn-start').addEventListener('click', function () {
            startGame(1);
        });
        document.getElementById('btn-levels').addEventListener('click', function () {
            playBgm(MAIN_BGM);
            renderLevelList();
            showScreen('level-screen');
        });
        document.getElementById('btn-howto').addEventListener('click', function () {
            stopBgm();
            window.location.href = 'tutorial.html';
        });
        document.getElementById('btn-back-home').addEventListener('click', goHome);
        document.querySelectorAll('[data-go-home]').forEach(function (btn) {
            btn.addEventListener('click', goHome);
        });
        document.getElementById('btn-retry').addEventListener('click', function () {
            beginLevel(currentLevelId);
        });
        document.getElementById('btn-next-level').addEventListener('click', function () {
            beginLevel(Math.min(LEVELS.length, currentLevelId + 1));
        });
        document.getElementById('btn-to-levels').addEventListener('click', function () {
            playBgm(MAIN_BGM);
            hideResultOverlay();
            renderLevelList();
            showScreen('level-screen');
        });

        const BOARD_SIZE = 8;
        const CANDY_TYPES = [
            { name: '珍奶', img: 'assets/images/item-boba.png' },
            { name: '地瓜球', img: 'assets/images/item-sweetpotato.png' },
            { name: '臭豆腐', img: 'assets/images/item-tofu.png' },
            { name: '雞排', img: 'assets/images/item-chicken.png' },
            { name: '蚵仔煎', img: 'assets/images/item-oyster.png' }
        ];

        const boardElement = document.getElementById('board');
        const scoreElement = document.getElementById('score');
        const boardWrap = document.getElementById('board-wrap');
        const fxLayer = document.getElementById('fx-layer');
        const comboBanner = document.getElementById('combo-banner');
        const gameTitleEl = document.getElementById('game-title');
        const levelLabelEl = document.getElementById('level-label');
        const goalScoreEl = document.getElementById('goal-score');
        const movesLeftEl = document.getElementById('moves-left');
        const resultOverlay = document.getElementById('result-overlay');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const btnNextLevel = document.getElementById('btn-next-level');
        const levelListEl = document.getElementById('level-list');
        const gameScreenEl = document.getElementById('game-screen');

        const MATCH_ANIM_MS = 380;
        const DROP_ANIM_MS = 450;
        const NEW_DROP_ANIM_MS = 520;
        const SWAP_ANIM_MS = 205;
        const SWAP_BACK_ANIM_MS = 180;
        const LEVEL_ENTRY_ANIM_MS = 480;
        const CLEARED_STORAGE_KEY = 'nightmarket-cleared-levels';
        let entryAnimationToken = 0;

        // ===== 最新關卡設定 =====
        const LEVELS = [
            { id: 1, name: '逢甲夜市', title: '逢甲夜市消消樂', goal: 400, moves: 20, bg: 'assets/images/bg-fengjia.png', bgm: MAIN_BGM },
            { id: 2, name: '饒河夜市', title: '饒河夜市消消樂', goal: 700, moves: 18, bg: 'assets/images/bg-raohe.png', bgm: MAIN_BGM },
            { id: 3, name: '東大門夜市', title: '東大門夜市消消樂', goal: 1000, moves: 16, bg: 'assets/images/bg-dongdamen.png', bgm: MAIN_BGM },
            { id: 4, name: '花園夜市', title: '花園夜市消消樂', goal: 1400, moves: 14, bg: 'assets/images/bg-huayuan.png', bgm: MAIN_BGM },
            { id: 5, name: '武聖夜市', title: '武聖夜市消消樂', goal: 2000, moves: 12, bg: 'assets/images/bg-wusheng.png', bgm: 'assets/audio/grim_pursuit.mp3' }
        ];

        let board = [];
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTile = null;
        let score = 0;
        let isBusy = false;
        let currentLevelId = 1;
        let movesLeft = 20;
        let levelOver = false;

        function getClearedCount() {
            const raw = parseInt(localStorage.getItem(CLEARED_STORAGE_KEY), 10);
            if (isNaN(raw) || raw < 0) return 0;
            return Math.min(LEVELS.length, raw);
        }

        function setClearedCount(count) {
            localStorage.setItem(CLEARED_STORAGE_KEY, String(Math.max(getClearedCount(), count)));
        }

        function isLevelUnlocked(levelId) {
            return levelId <= getClearedCount() + 1;
        }

        function getContinueLevelId() {
            const cleared = getClearedCount();
            return Math.min(LEVELS.length, cleared + 1);
        }

        function getLevelConfig(levelId) {
            return LEVELS.find(function (lv) { return lv.id === levelId; }) || LEVELS[0];
        }

        function updateHud() {
            const lv = getLevelConfig(currentLevelId);
            if (gameTitleEl) gameTitleEl.textContent = lv.title;
            if (levelLabelEl) levelLabelEl.textContent = '第 ' + lv.id + ' 關';
            if (scoreElement) scoreElement.innerText = score;
            if (goalScoreEl) goalScoreEl.innerText = lv.goal;
            if (movesLeftEl) movesLeftEl.innerText = movesLeft;
            // 動態更換遊戲背景圖
            if (gameScreenEl) gameScreenEl.style.backgroundImage = "url('" + lv.bg + "')";
        }

        function renderLevelList() {
            if (!levelListEl) return;
            levelListEl.innerHTML = '';
            LEVELS.forEach(function (lv) {
                const unlocked = isLevelUnlocked(lv.id);
                const cleared = getClearedCount() >= lv.id;
                const btn = document.createElement('button');
                btn.className = 'level-card' + (unlocked ? '' : ' locked');
                btn.type = 'button';
                btn.disabled = !unlocked;
                btn.innerHTML =
                    '<strong>第 ' + lv.id + ' 關：' + lv.name + '</strong>' +
                    '<small>' +
                    (unlocked
                        ? (cleared ? '已通關 目標 ' + lv.goal + ' 步數 ' + lv.moves : '已解鎖，點擊開始 目標 ' + lv.goal + ' 步數 ' + lv.moves)
                        : '尚未解鎖') +
                    '</small>';
                if (unlocked) {
                    btn.addEventListener('click', function () {
                        beginLevel(lv.id);
                    });
                }
                levelListEl.appendChild(btn);
            });
        }

        function hideResultOverlay() {
            if (!resultOverlay) return;
            resultOverlay.classList.remove('show');
            resultOverlay.setAttribute('aria-hidden', 'true');
        }

        function showResultOverlay(won) {
            const lv = getLevelConfig(currentLevelId);
            resultOverlay.classList.add('show');
            resultOverlay.setAttribute('aria-hidden', 'false');
            if (won) {
                resultTitle.textContent = currentLevelId >= LEVELS.length ? '夜市全制霸！' : '通關成功！';
                resultDesc.textContent = currentLevelId >= LEVELS.length
                    ? ('你在「' + lv.name + '」拿到 ' + score + ' 分，五關全部闖關完成！')
                    : ('你在「' + lv.name + '」拿到 ' + score + ' 分，下一關已解鎖！');
                btnNextLevel.style.display = currentLevelId >= LEVELS.length ? 'none' : 'block';
            } else {
                resultTitle.textContent = '步數用盡';
                resultDesc.textContent = '目標 ' + lv.goal + ' 分，目前 ' + score + ' 分。再試一次挑戰「' + lv.name + '」吧！';
                btnNextLevel.style.display = 'none';
            }
        }

        async function beginLevel(levelId) {
            if (!isLevelUnlocked(levelId)) {
                renderLevelList();
                showScreen('level-screen');
                return;
            }
            const lv = getLevelConfig(levelId);
            currentLevelId = lv.id;
            score = 0;
            movesLeft = lv.moves;
            levelOver = false;
            touchStartTile = null;
            isBusy = false;
            hideResultOverlay();
            updateHud();
            playBgm(lv.bgm);
            if (fxLayer) fxLayer.innerHTML = '';
            if (comboBanner) {
                comboBanner.className = '';
                comboBanner.textContent = '';
            }
            initBoard();
            showScreen('game-screen');
            await playLevelEntryAnimation();
        }

        function getBaseClearScore(count) {
            if (count >= 8) return 180;
            if (count === 7) return 140;
            if (count === 6) return 110;
            if (count === 5) return 80;
            if (count === 4) return 50;
            if (count === 3) return 30;
            return 0;
        }

        function getComboMultiplier(combo) {
            if (combo >= 7) return 4;
            if (combo === 6) return 3.5;
            if (combo === 5) return 3;
            if (combo === 4) return 2.5;
            if (combo === 3) return 2;
            if (combo === 2) return 1.5;
            return 1;
        }

        function getComboBonus(combo) {
            if (combo >= 7) return 100;
            if (combo === 6) return 80;
            if (combo === 5) return 60;
            if (combo === 4) return 40;
            if (combo === 3) return 20;
            if (combo === 2) return 10;
            return 0;
        }

        function calcClearScore(matchCount, combo) {
            return Math.round(getBaseClearScore(matchCount) * getComboMultiplier(combo) + getComboBonus(combo));
        }

        function finishMove() {
            if (levelOver) return;
            movesLeft = Math.max(0, movesLeft - 1);
            updateHud();
            const goal = getLevelConfig(currentLevelId).goal;
            if (score >= goal) {
                levelOver = true;
                setClearedCount(currentLevelId);
                showResultOverlay(true);
            } else if (movesLeft <= 0) {
                levelOver = true;
                showResultOverlay(false);
            }
        }

        renderLevelList();

        function initBoard() {
            isBusy = false;
            boardElement.classList.remove('busy', 'shake-sm', 'shake-md', 'shake-lg');
            for (let r = 0; r < BOARD_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let randomType;
                    do {
                        randomType = Math.floor(Math.random() * CANDY_TYPES.length);
                    } while (
                        (c >= 2 && board[r][c - 1] === randomType && board[r][c - 2] === randomType) ||
                        (r >= 2 && board[r - 1][c] === randomType && board[r - 2][c] === randomType)
                    );
                    board[r][c] = randomType;
                }
            }
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');

                    const typeIndex = board[r][c];
                    if (typeIndex !== null) {
                        const type = CANDY_TYPES[typeIndex];
                        const img = document.createElement('img');
                        img.src = type.img;
                        img.alt = type.name;
                        tile.appendChild(img);
                    } else {
                        tile.style.backgroundColor = 'transparent';
                    }

                    tile.dataset.row = r;
                    tile.dataset.col = c;

                    tile.addEventListener('pointerdown', onPointerDown);
                    tile.addEventListener('pointerup', onPointerUp);
                    boardElement.appendChild(tile);
                }
            }
        }

        function onPointerDown(e) {
            if (isBusy || levelOver) return;
            touchStartX = e.clientX;
            touchStartY = e.clientY;
            touchStartTile = {
                r: parseInt(e.currentTarget.dataset.row),
                c: parseInt(e.currentTarget.dataset.col)
            };
            e.currentTarget.setPointerCapture(e.pointerId);
        }

        function onPointerUp(e) {
            if (isBusy || levelOver || !touchStartTile) return;

            const dx = e.clientX - touchStartX;
            const dy = e.clientY - touchStartY;
            const distance = Math.max(Math.abs(dx), Math.abs(dy));
            const r1 = touchStartTile.r;
            const c1 = touchStartTile.c;
            let r2 = r1;
            let c2 = c1;

            touchStartTile = null;
            if (distance < 20) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                c2 += dx > 0 ? 1 : -1;
            } else {
                r2 += dy > 0 ? 1 : -1;
            }

            if (r2 < 0 || r2 >= BOARD_SIZE || c2 < 0 || c2 >= BOARD_SIZE) return;

            swapTilesAndCheck(r1, c1, r2, c2);
        }

        async function swapTilesAndCheck(r1, c1, r2, c2) {
            const firstTile = boardElement.querySelector('[data-row="' + r1 + '"][data-col="' + c1 + '"]');
            const secondTile = boardElement.querySelector('[data-row="' + r2 + '"][data-col="' + c2 + '"]');
            if (!firstTile || !secondTile) return;

            // Lock before the first animation frame so a second gesture cannot
            // start while these two DOM tiles are between cells.
            isBusy = true;
            boardElement.classList.add('busy');

            const firstRect = firstTile.getBoundingClientRect();
            const secondRect = secondTile.getBoundingClientRect();
            firstTile.style.setProperty('--swap-x', (secondRect.left - firstRect.left) + 'px');
            firstTile.style.setProperty('--swap-y', (secondRect.top - firstRect.top) + 'px');
            secondTile.style.setProperty('--swap-x', (firstRect.left - secondRect.left) + 'px');
            secondTile.style.setProperty('--swap-y', (firstRect.top - secondRect.top) + 'px');

            // Establish the zero-transform state before enabling the transform.
            void firstTile.offsetWidth;
            firstTile.classList.add('swapping');
            secondTile.classList.add('swapping');
            await wait(SWAP_ANIM_MS);

            // Commit the data only once the forward motion has reached its
            // destination. renderBoard() may safely recreate DOM tiles now.
            swapTiles(r1, c1, r2, c2);
            const matches = checkMatches();
            if (matches.length > 0) {
                renderBoard();
                await handleMatches(matches, 1);
                return;
            }

            // No match: restore the data immediately, then visibly travel back
            // on the same DOM nodes rather than rebuilding the board mid-motion.
            swapTiles(r1, c1, r2, c2);
            firstTile.classList.add('swap-back');
            secondTile.classList.add('swap-back');
            await wait(SWAP_BACK_ANIM_MS);

            firstTile.classList.remove('swapping', 'swap-back');
            secondTile.classList.remove('swapping', 'swap-back');
            firstTile.style.removeProperty('--swap-x');
            firstTile.style.removeProperty('--swap-y');
            secondTile.style.removeProperty('--swap-x');
            secondTile.style.removeProperty('--swap-y');
            isBusy = false;
            boardElement.classList.remove('busy');
        }

        function swapTiles(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
        }

        function checkMatches() {
            let matchedTiles = new Set();
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE - 2; c++) {
                    let type = board[r][c];
                    if (type !== null && type === board[r][c + 1] && type === board[r][c + 2]) {
                        matchedTiles.add(`${r},${c}`);
                        matchedTiles.add(`${r},${c + 1}`);
                        matchedTiles.add(`${r},${c + 2}`);
                    }
                }
            }
            for (let c = 0; c < BOARD_SIZE; c++) {
                for (let r = 0; r < BOARD_SIZE - 2; r++) {
                    let type = board[r][c];
                    if (type !== null && type === board[r + 1][c] && type === board[r + 2][c]) {
                        matchedTiles.add(`${r},${c}`);
                        matchedTiles.add(`${r + 1},${c}`);
                        matchedTiles.add(`${r + 2},${c}`);
                    }
                }
            }
            return Array.from(matchedTiles).map(coord => {
                const [r, c] = coord.split(',').map(Number);
                return { r, c };
            });
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function getTileCenter(r, c) {
            const tile = boardElement.querySelector('[data-row="' + r + '"][data-col="' + c + '"]');
            if (!tile || !boardWrap) return { x: 0, y: 0 };
            const wrapRect = boardWrap.getBoundingClientRect();
            const tileRect = tile.getBoundingClientRect();
            return {
                x: tileRect.left - wrapRect.left + tileRect.width / 2,
                y: tileRect.top - wrapRect.top + tileRect.height / 2
            };
        }

        function spawnParticles(matches) {
            const isBigMatch = matches.length >= 6;
            matches.forEach(function (pos) {
                const center = getTileCenter(pos.r, pos.c);
                const kinds = ['star', 'dot', 'spark'];
                const count = (isBigMatch ? 6 : 3) + Math.floor(Math.random() * 2);
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('div');
                    const kind = kinds[i % kinds.length];
                    el.className = 'fx-particle ' + kind;
                    el.style.left = center.x + 'px';
                    el.style.top = center.y + 'px';
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.6;
                    const dist = (isBigMatch ? 28 : 18) + Math.random() * 28;
                    el.style.setProperty('--px', Math.cos(angle) * dist + 'px');
                    el.style.setProperty('--py', Math.sin(angle) * dist + 'px');
                    if (kind === 'star') el.textContent = '✦';
                    fxLayer.appendChild(el);
                    setTimeout(() => el.remove(), 650);
                }
            });
        }

        function spawnFloatWords(matches) {
            const word = '香！';

            matches.forEach(function (pos, index) {
                const center = getTileCenter(pos.r, pos.c);
                const el = document.createElement('div');
                el.className = 'fx-float-word';
                el.textContent = word;
                el.style.left = center.x + 'px';
                el.style.top = center.y + 'px';

                const delay = (index % 3) * 30;
                el.style.animationDelay = delay + 'ms';

                fxLayer.appendChild(el);
                setTimeout(() => el.remove(), 650);
            });
        }

        function triggerBoardShake(combo, matchCount) {
            boardElement.classList.remove('shake-sm', 'shake-md', 'shake-lg');
            void boardElement.offsetWidth;
            if (combo >= 4 || matchCount >= 6) {
                boardElement.classList.add('shake-lg');
            } else if (combo >= 2 || matchCount >= 4) {
                boardElement.classList.add('shake-md');
            } else {
                boardElement.classList.add('shake-sm');
            }
        }

        function showScorePopup(points) {
            const pop = document.createElement('div');
            pop.className = 'fx-score-pop';
            pop.textContent = '+' + points;
            fxLayer.appendChild(pop);
            setTimeout(() => pop.remove(), 720);
        }

        function showComboBanner(combo, matchCount) {
            comboBanner.className = '';
            void comboBanner.offsetWidth;

            if (combo <= 1) {
                comboBanner.textContent = '好呷！';
                comboBanner.classList.add('combo-1');
            } else if (combo === 2) {
                comboBanner.textContent = 'COMBO ×2！\n續攤啦！';
                comboBanner.classList.add('combo-2');
            } else if (combo === 3) {
                comboBanner.textContent = 'COMBO ×3！\n大排長龍！';
                comboBanner.classList.add('combo-3');
            } else {
                comboBanner.textContent = 'COMBO ×' + combo + '！\n橫掃夜市！';
                comboBanner.classList.add('combo-4');
            }
            comboBanner.classList.add('show');
            setTimeout(() => comboBanner.classList.remove('show'), 600);
        }

        function playMatchAnimation(matches) {
            matches.forEach(function (pos) {
                const tile = boardElement.querySelector('[data-row="' + pos.r + '"][data-col="' + pos.c + '"]');
                if (tile) tile.classList.add('matching');
            });
        }

        function getFallMap() {
            const map = {};
            for (let c = 0; c < BOARD_SIZE; c++) {
                let holes = 0;
                for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                    if (board[r][c] === null) {
                        holes++;
                    } else if (holes > 0) {
                        map[(r + holes) + ',' + c] = holes;
                    }
                }
            }
            return map;
        }

        function playDropAnimations(fallMap, newTiles, newCountByCol) {
            const tileSize = boardElement.clientHeight / BOARD_SIZE;
            let maxDuration = DROP_ANIM_MS;

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const key = r + ',' + c;
                    const tile = boardElement.querySelector('[data-row="' + r + '"][data-col="' + c + '"]');
                    if (!tile) continue;

                    if (newTiles.has(key)) {
                        const fallCells = newCountByCol[c] || 1;
                        const delay = c * 12 + r * 10;
                        tile.style.setProperty('--drop-from', (-fallCells * tileSize) + 'px');
                        tile.style.animationDelay = delay + 'ms';
                        tile.classList.add('tile-drop-new');
                        maxDuration = Math.max(maxDuration, NEW_DROP_ANIM_MS + delay);
                    } else if (fallMap[key]) {
                        const delay = c * 10 + r * 6;
                        tile.style.setProperty('--drop-from', (-fallMap[key] * tileSize) + 'px');
                        tile.style.animationDelay = delay + 'ms';
                        tile.classList.add('tile-drop');
                        maxDuration = Math.max(maxDuration, DROP_ANIM_MS + delay);
                    }
                }
            }
            return maxDuration;
        }

        async function playLevelEntryAnimation() {
            const token = ++entryAnimationToken;
            isBusy = true;
            boardElement.classList.add('busy');

            const boardHeight = boardElement.clientHeight || boardElement.offsetWidth || 500;
            const tileSize = boardHeight / BOARD_SIZE;
            let maxDuration = LEVEL_ENTRY_ANIM_MS;

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const tile = boardElement.querySelector('[data-row="' + r + '"][data-col="' + c + '"]');
                    if (!tile) continue;

                    // 讓方塊從棋盤頂部上方外圍落下
                    const dropDistance = (r + 2.5) * tileSize;
                    const delay = c * 22 + r * 14;

                    tile.style.setProperty('--entry-from', (-dropDistance) + 'px');
                    tile.style.animationDelay = delay + 'ms';
                    tile.classList.add('level-entry');

                    maxDuration = Math.max(maxDuration, LEVEL_ENTRY_ANIM_MS + delay);
                }
            }

            await wait(maxDuration);

            if (token !== entryAnimationToken) return;

            // 動畫結束清理 class 與行內樣式，恢復乾淨狀態
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const tile = boardElement.querySelector('[data-row="' + r + '"][data-col="' + c + '"]');
                    if (tile) {
                        tile.classList.remove('level-entry');
                        tile.style.removeProperty('--entry-from');
                        tile.style.removeProperty('animation-delay');
                    }
                }
            }

            isBusy = false;
            boardElement.classList.remove('busy');
        }

        async function handleMatches(matches, combo) {
            combo = combo || 1;
            isBusy = true;
            boardElement.classList.add('busy');

            const points = calcClearScore(matches.length, combo);
            score += points;
            updateHud();

            showComboBanner(combo, matches.length);
            showScorePopup(points);
            triggerBoardShake(combo, matches.length);
            spawnFloatWords(matches);
            spawnParticles(matches);
            playMatchAnimation(matches);

            await wait(MATCH_ANIM_MS);

            matches.forEach(function ({ r, c }) {
                board[r][c] = null;
            });

            const fallMap = getFallMap();
            const newCountByCol = [];
            for (let c = 0; c < BOARD_SIZE; c++) {
                let holes = 0;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][c] === null) holes++;
                }
                newCountByCol[c] = holes;
            }

            applyGravity();
            const newTiles = fillNewTiles();
            renderBoard();

            const dropMs = playDropAnimations(fallMap, newTiles, newCountByCol);
            await wait(dropMs);

            const newMatches = checkMatches();
            if (newMatches.length > 0) {
                await handleMatches(newMatches, combo + 1);
            } else {
                isBusy = false;
                boardElement.classList.remove('busy');
                finishMove();
            }
        }

        function applyGravity() {
            for (let c = 0; c < BOARD_SIZE; c++) {
                let emptyRow = BOARD_SIZE - 1;
                for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                    if (board[r][c] !== null) {
                        board[emptyRow][c] = board[r][c];
                        if (emptyRow !== r) board[r][c] = null;
                        emptyRow--;
                    }
                }
            }
        }

        function fillNewTiles() {
            const newTiles = new Set();
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === null) {
                        board[r][c] = Math.floor(Math.random() * CANDY_TYPES.length);
                        newTiles.add(r + ',' + c);
                    }
                }
            }
            return newTiles;
        }

        const tutorialParams = new URLSearchParams(window.location.search);
        if (tutorialParams.get('startGame') === 'true') {
            startGame(1);
        } else {
            playBgm(MAIN_BGM);
        }

        // 瀏覽器通常限制未經互動的自動播放，加入首次手勢/點擊解鎖監聽
        const unlockAudio = function () {
            if (bgmEnabled && bgmPlayer && bgmPlayer.paused) {
                const activeScreen = document.querySelector('.screen.active');
                if (activeScreen && activeScreen.id === 'game-screen') {
                    const lv = getLevelConfig(currentLevelId);
                    playBgm(lv ? lv.bgm : MAIN_BGM);
                } else {
                    playBgm(MAIN_BGM);
                }
            }
            window.removeEventListener('pointerdown', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
        };
        window.addEventListener('pointerdown', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
    </script>
</body>
